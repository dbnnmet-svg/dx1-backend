<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DX-1 | DBNN</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.7.0/styles/atom-one-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.7.0/highlight.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #050505; color: #e2e8f0; overflow: hidden; }
        #cursor-glow { position: fixed; width: 700px; height: 700px; background: radial-gradient(circle, rgba(59, 130, 246, 0.07) 0%, rgba(99, 102, 241, 0.02) 40%, rgba(0, 0, 0, 0) 70%); transform: translate(-50%, -50%); pointer-events: none; z-index: 0; transition: opacity 0.5s ease; }
        .glass { background: rgba(15, 17, 21, 0.6); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.06); }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
        .msg-anim { animation: fadeIn 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        .prose pre { background: #0d1117 !important; border: 1px solid rgba(255,255,255,0.05); }
        #mode-menu { transform-origin: bottom left; transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1); }
        .menu-hidden { opacity: 0; transform: scale(0.9) translateY(10px); pointer-events: none; }
        .menu-visible { opacity: 1; transform: scale(1) translateY(0); pointer-events: auto; }
    </style>
</head>
<body class="h-screen flex flex-col relative">
    <div id="cursor-glow"></div>
    <div class="fixed top-6 left-6 z-50 flex items-center gap-3 select-none">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-blue-600 to-indigo-600 flex items-center justify-center font-bold text-white">DX</div>
        <div class="flex flex-col">
            <span class="text-xs font-bold tracking-widest text-white/80 uppercase">Interface</span>
            <span class="text-[9px] text-blue-500 font-mono tracking-tighter">DBNN CORE v3.5</span>
        </div>
    </div>

    <main class="flex-1 flex overflow-hidden relative z-10">
        <div id="chat-container" class="flex-1 flex flex-col relative">
            <div id="messages" class="flex-1 overflow-y-auto p-6 space-y-8 max-w-4xl mx-auto w-full scroll-smooth pb-40 pt-20">
                <div class="flex gap-4 items-start msg-anim">
                    <div class="w-8 h-8 rounded-lg bg-white/5 border border-white/10 flex items-center justify-center text-[10px] font-bold text-blue-400">SYS</div>
                    <div class="glass border border-white/5 rounded-2xl rounded-tl-none p-5 max-w-[85%] text-gray-300">
                        <p class="text-sm">DX-1 active. Select a mode and begin.</p>
                    </div>
                </div>
            </div>

            <div class="absolute bottom-8 left-0 w-full px-6 z-30">
                <div class="max-w-3xl mx-auto relative">
                    <div id="mode-menu" class="absolute bottom-full left-0 mb-3 w-56 glass border border-white/10 rounded-2xl shadow-2xl p-1.5 z-50 menu-hidden">
                        <button onclick="selectMode('chat', 'fa-comment-dots')" class="w-full text-left px-3 py-2.5 rounded-xl hover:bg-white/5 text-sm text-gray-300 flex items-center gap-3"><i class="fas fa-comment-dots text-blue-400"></i> Chat</button>
                        <button onclick="selectMode('canvas', 'fa-code')" class="w-full text-left px-3 py-2.5 rounded-xl hover:bg-white/5 text-sm text-gray-300 flex items-center gap-3"><i class="fas fa-code text-purple-400"></i> Canvas</button>
                        <button onclick="selectMode('study', 'fa-graduation-cap')" class="w-full text-left px-3 py-2.5 rounded-xl hover:bg-white/5 text-sm text-gray-300 flex items-center gap-3"><i class="fas fa-graduation-cap text-green-400"></i> Study</button>
                    </div>
                    <div class="relative flex items-end glass rounded-2xl border border-white/10 shadow-2xl overflow-hidden">
                        <button onclick="toggleModeMenu()" id="mode-trigger" class="h-14 w-14 flex items-center justify-center text-blue-400 border-r border-white/5"><i class="fas fa-comment-dots text-lg" id="current-mode-icon"></i></button>
                        <textarea id="user-input" rows="1" class="flex-1 bg-transparent text-gray-200 pl-4 pr-14 py-4 focus:outline-none resize-none placeholder-gray-600 max-h-48 text-sm" placeholder="Initialize command..."></textarea>
                        <button onclick="sendMessage()" class="absolute right-2 bottom-2 h-10 w-10 bg-blue-600 hover:bg-blue-500 text-white rounded-xl flex items-center justify-center"><i class="fas fa-arrow-up text-sm"></i></button>
                    </div>
                </div>
            </div>
        </div>

        <div id="preview-panel" class="w-0 bg-[#0d1117] border-l border-white/5 transition-all duration-500 flex flex-col z-40">
            <div class="h-14 border-b border-white/5 flex items-center justify-between px-6 bg-[#050505]">
                <span class="text-xs font-bold text-gray-400 uppercase tracking-widest" id="preview-title">Output Buffer</span>
                <button onclick="togglePreview(false)" class="text-gray-500 hover:text-white"><i class="fas fa-times"></i></button>
            </div>
            <div id="preview-content" class="flex-1 overflow-auto bg-[#0d1117]"></div>
        </div>
    </main>

    <script>
        let currentMode = 'chat';
        let conversationHistory = [];
        let isGenerating = false;

        document.addEventListener('mousemove', (e) => {
            const glow = document.getElementById('cursor-glow');
            glow.style.left = e.clientX + 'px';
            glow.style.top = e.clientY + 'px';
        });

        function toggleModeMenu() {
            const menu = document.getElementById('mode-menu');
            menu.classList.toggle('menu-hidden');
            menu.classList.toggle('menu-visible');
        }

        function selectMode(mode, iconClass) {
            currentMode = mode;
            document.getElementById('current-mode-icon').className = `fas ${iconClass}`;
            toggleModeMenu();
            if (mode === 'canvas' || mode === 'study') togglePreview(true);
            else togglePreview(false);
        }

        async function sendMessage() {
            const input = document.getElementById('user-input');
            const message = input.value.trim();
            if (!message || isGenerating) return;

            addMessageToUI('user', message);
            input.value = '';
            isGenerating = true;

            const aiBubble = addMessageToUI('ai', '...');
            let fullResponse = "";

            try {
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message, mode: currentMode, history: conversationHistory })
                });

                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                aiBubble.innerHTML = '';

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;
                    fullResponse += decoder.decode(value);
                    if (currentMode !== 'study') {
                        aiBubble.innerHTML = marked.parse(fullResponse);
                        hljs.highlightAll();
                    } else {
                        aiBubble.innerHTML = "<p class='text-blue-400 animate-pulse'>Compiling Study Module...</p>";
                    }
                }

                conversationHistory.push({ role: "user", content: message }, { role: "assistant", content: fullResponse });

                if (currentMode === 'canvas') extractAndRenderHTML(fullResponse);
                if (currentMode === 'study') renderStudyMode(fullResponse, aiBubble);

            } catch (error) {
                aiBubble.innerHTML = `Error: ${error.message}`;
            } finally {
                isGenerating = false;
            }
        }

        function addMessageToUI(role, content) {
            const container = document.getElementById('messages');
            const wrapper = document.createElement('div');
            wrapper.className = `flex gap-4 msg-anim ${role === 'user' ? 'flex-row-reverse' : ''}`;
            const bubble = document.createElement('div');
            bubble.className = `p-4 max-w-[85%] rounded-2xl prose prose-invert text-sm ${role === 'user' ? 'bg-blue-600 text-white' : 'glass text-gray-200'}`;
            bubble.innerHTML = content;
            wrapper.appendChild(bubble);
            container.appendChild(wrapper);
            container.scrollTo({ top: container.scrollHeight, behavior: 'smooth' });
            return bubble;
        }

        function togglePreview(show) {
            const p = document.getElementById('preview-panel');
            p.style.width = show ? "45%" : "0";
        }

        function extractAndRenderHTML(text) {
            const match = text.match(/```html([\s\S]*?)```/) || text.match(/<html>([\s\S]*?)<\/html>/);
            if (match) {
                const previewContainer = document.getElementById('preview-content');
                previewContainer.innerHTML = `<iframe class="w-full h-full bg-white"></iframe>`;
                const doc = previewContainer.querySelector('iframe').contentWindow.document;
                doc.open(); doc.write(match[1] || match[0]); doc.close();
                togglePreview(true);
            }
        }

        function renderStudyMode(text, msgDiv) {
            const jsonMatch = text.match(/```json([\s\S]*?)```/) || text.match(/\[\s*\{[\s\S]*\}\s*\]/);
            if (jsonMatch) {
                try {
                    const data = JSON.parse(jsonMatch[1] || jsonMatch[0]);
                    msgDiv.innerHTML = "Study Module Loaded.";
                    const preview = document.getElementById('preview-content');
                    preview.innerHTML = `<div class="p-8 space-y-6"></div>`;
                    data.forEach(item => {
                        const card = document.createElement('div');
                        card.className = "bg-[#161b22] p-6 rounded-2xl border border-white/5 shadow-xl";
                        if (item.type === 'slide') {
                            card.innerHTML = `<h3 class="text-blue-400 font-bold mb-2">${item.title}</h3><p class="text-gray-400 text-sm">${item.content}</p>`;
                        } else {
                            card.innerHTML = `<h3 class="text-white text-sm mb-4">${item.question}</h3><div class="space-y-2">
                                ${item.options.map((o, idx) => `<button onclick="this.style.background='${idx===item.answer?'#10b981':'#ef4444'}'" class="w-full text-left p-3 rounded-xl bg-white/5 border border-white/5 text-xs">${o}</button>`).join('')}
                            </div>`;
                        }
                        preview.firstChild.appendChild(card);
                    });
                    togglePreview(true);
                } catch(e) { msgDiv.innerHTML = marked.parse(text); }
            } else msgDiv.innerHTML = marked.parse(text);
        }
    </script>
</body>
</html>
