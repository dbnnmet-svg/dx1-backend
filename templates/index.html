<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>DBNN DX-1 | Neural OS</title>

<!-- External Assets -->
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<link href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark-dimmed.min.css" rel="stylesheet" />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />

<style>
:root {
  --bg-deep: #050508;
  --bg-surface: #0a0a0f;
  --glass-bg: rgba(15, 15, 20, 0.85);
  --glass-border: rgba(255, 255, 255, 0.08);
  --primary: #6366f1;
  --text-main: #f8fafc;
}

/* Base Reset */
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: var(--bg-deep);
}

body {
  background:
    radial-gradient(circle at 0% 0%, rgba(59, 130, 246, 0.15) 0%, transparent 40%),
    radial-gradient(circle at 100% 100%, rgba(239, 68, 68, 0.15) 0%, transparent 40%),
    var(--bg-deep);
  color: var(--text-main);
  font-family: 'Inter', sans-serif;
  display: flex;
}

h1, h2, h3, .font-display { font-family: 'Space Grotesk', sans-serif; }

#neural-canvas {
  position: fixed;
  top: 0; left: 0; width: 100%; height: 100%;
  z-index: 0;
  pointer-events: none;
}

#main-layout {
  position: relative;
  z-index: 10;
  display: flex;
  width: 100%;
  height: 100%;
}

.dx-hero-logo {
  font-family: 'Space Grotesk', sans-serif;
  font-weight: 900;
  font-size: 4rem;
  letter-spacing: -4px;
  margin-bottom: -10px;
  background: linear-gradient(135deg, #60a5fa 0%, #f87171 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  filter: drop-shadow(0 0 25px rgba(96, 165, 250, 0.6));
  animation: logoPulse 4s infinite ease-in-out;
}

@keyframes logoPulse {
  0%, 100% { filter: drop-shadow(0 0 25px rgba(96, 165, 250, 0.4)); transform: scale(1); }
  50% { filter: drop-shadow(0 0 40px rgba(248, 113, 113, 0.6)); transform: scale(1.02); }
}

.top-left-logo {
  position: fixed;
  top: 20px;
  left: 24px;
  z-index: 100;
  display: flex;
  align-items: center;
  gap: 8px;
  font-family: 'Space Grotesk', sans-serif;
  font-weight: 800;
  font-size: 1.5rem;
  letter-spacing: -1px;
}

.dx-text-small {
  background: linear-gradient(to right, #60a5fa, #f87171);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  filter: drop-shadow(0 0 8px rgba(96, 165, 250, 0.4));
}

#chat-section {
  flex: 1;
  display: flex;
  flex-direction: column;
  height: 100%;
  min-width: 0;
}

#hero-container {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 20px;
  text-align: center;
  transition: all 0.5s ease;
}

.neon-text {
  font-size: 2.5rem;
  font-weight: 500;
  color: rgba(255, 255, 255, 0.9);
  text-transform: lowercase;
  letter-spacing: -1px;
  margin-bottom: 2.5rem;
}

.chat-container {
  flex: 1;
  overflow-y: auto;
  padding: 20px;
  display: none;
}

.chat-wrapper {
  max-width: 850px;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  padding-bottom: 180px;
}

.ai-bubble { display: flex; gap: 16px; margin-bottom: 32px; position: relative; }
.ai-avatar {
  width: 36px; height: 36px; border-radius: 10px;
  background: linear-gradient(45deg, #1e1e2e, #2a2a40);
  border: 1px solid var(--glass-border);
  display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  box-shadow: 0 0 15px rgba(59, 130, 246, 0.2);
}

.user-bubble {
  align-self: flex-end;
  background: rgba(255, 255, 255, 0.05);
  border: 1px solid var(--glass-border);
  padding: 12px 20px;
  border-radius: 20px 20px 4px 20px;
  max-width: 80%;
  margin-bottom: 32px;
  box-shadow: 0 4px 15px rgba(0,0,0,0.2);
}

.apple-code-wrapper { margin: 24px 0; }
.ai-content pre {
  background: #16161e !important;
  border-radius: 0 0 12px 12px !important;
  margin: 0 !important;
  border: 1px solid rgba(255, 255, 255, 0.1);
  border-top: none;
  overflow: hidden;
}

.code-header {
  background: #242433;
  padding: 10px 16px;
  display: flex;
  align-items: center;
  gap: 8px;
  border: 1px solid rgba(255, 255, 255, 0.1);
  border-radius: 12px 12px 0 0;
}

.dot { width: 12px; height: 12px; border-radius: 50%; }
.dot-red { background: #ff5f56; }
.dot-yellow { background: #ffbd2e; }
.dot-green { background: #27c93f; }

.ai-content code {
  display: block;
  padding: 20px !important;
  font-family: 'Fira Code', monospace;
  font-size: 13px;
  line-height: 1.6;
}

.input-area-wrapper {
  position: absolute;
  bottom: 0; width: 100%; padding: 24px 20px 10px;
  background: linear-gradient(to top, var(--bg-deep) 70%, transparent);
  z-index: 50;
  display: flex;
  flex-direction: column;
  align-items: center;
}

.input-container-main { width: 100%; max-width: 800px; position: relative; }

.input-island {
  background: rgba(20, 20, 30, 0.7); backdrop-filter: blur(30px);
  -webkit-backdrop-filter: blur(30px); border: 1px solid var(--glass-border);
  border-radius: 24px; padding: 8px 12px 8px 16px;
  display: flex; align-items: center; gap: 8px;
  box-shadow: 0 15px 50px rgba(0,0,0,0.5);
}

#mode-popup {
  position: absolute;
  bottom: calc(100% + 12px);
  left: 12px;
  background: rgba(15, 15, 25, 0.95);
  backdrop-filter: blur(20px);
  border: 1px solid var(--glass-border);
  border-radius: 16px;
  padding: 8px;
  display: none;
  flex-direction: column;
  gap: 4px;
  min-width: 160px;
  z-index: 100;
}

.mode-option {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 12px;
  border-radius: 10px;
  cursor: pointer;
  color: #94a3b8;
}

.mode-option.active {
  background: rgba(99, 102, 241, 0.15);
  color: white;
}

.mode-trigger-btn {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 8px 14px;
  border-radius: 18px;
  background: rgba(255, 255, 255, 0.05);
  border: 1px solid var(--glass-border);
  color: white;
  font-size: 13px;
  font-weight: 600;
}

input { background: transparent; border: none; flex: 1; color: white; outline: none; font-size: 15px; height: 44px; }

.footer-disclaimer {
  font-size: 10px;
  color: rgba(255, 255, 255, 0.2);
  margin-top: 12px;
  letter-spacing: 0.5px;
  text-align: center;
}

#suggestions-grid {
  display: grid; gap: 16px;
  grid-template-columns: repeat(3, 1fr);
  width: 100%; max-width: 700px;
}

.suggestion-card {
  background: rgba(255, 255, 255, 0.02);
  border: 1px solid var(--glass-border);
  padding: 20px; border-radius: 24px;
  transition: all 0.4s;
  cursor: pointer;
}

.suggestion-card:hover {
  background: rgba(255, 255, 255, 0.05);
  transform: translateY(-8px);
}

#preview-pane {
  position: fixed; right: -100%; top: 0; bottom: 0; width: 100%;
  background: #ffffff; z-index: 1000;
  transition: right 0.5s cubic-bezier(0.16, 1, 0.3, 1);
  display: flex; flex-direction: column;
}
@media (min-width: 1024px) { #preview-pane { width: 50%; } }
#preview-pane.active { right: 0; }

.cursor { display: inline-block; width: 6px; height: 14px; background: var(--primary); animation: blink 0.8s infinite; }
@keyframes blink { 50% { opacity: 0; } }

#mobile-preview-trigger {
  position: fixed; top: 20px; right: 20px; z-index: 60;
  display: none; background: rgba(59, 130, 246, 0.2);
  border: 1px solid rgba(59, 130, 246, 0.4);
  padding: 10px; border-radius: 12px; color: white;
}
</style>
</head>
<body>

<canvas id="neural-canvas"></canvas>

<div class="top-left-logo">
  <span class="dx-text-small">DX</span>
</div>

<div id="main-layout">
  <button id="mobile-preview-trigger" onclick="togglePreview()">
    <i data-lucide="layout" class="w-5 h-5"></i>
  </button>

  <section id="chat-section">
    <div id="hero-container">
      <div class="dx-hero-logo">DX</div>
      <h2 class="neon-text font-display">what do you need?</h2>

      <div id="suggestions-grid">
        <div class="suggestion-card" onclick="setMode('canvas'); quickSend('Design a futuristic music player UI')">
          <i data-lucide="layout" class="text-indigo-400 w-8 h-8 mb-3"></i>
          <div class="text-sm font-bold text-white uppercase tracking-widest">Canvas</div>
          <p class="text-[11px] text-slate-500 mt-2">Interactive Preview</p>
        </div>
        <div class="suggestion-card" onclick="setMode('deepthink'); quickSend('Explain quantum entanglement in simple terms')">
          <i data-lucide="brain-circuit" class="text-amber-400 w-8 h-8 mb-3"></i>
          <div class="text-sm font-bold text-white uppercase tracking-widest">Reason</div>
          <p class="text-[11px] text-slate-500 mt-2">Deep Intelligence</p>
        </div>
        <div class="suggestion-card" onclick="setMode('fast'); quickSend('Write a python script to scrape news headlines')">
          <i data-lucide="zap" class="text-pink-400 w-8 h-8 mb-3"></i>
          <div class="text-sm font-bold text-white uppercase tracking-widest">Fast</div>
          <p class="text-[11px] text-slate-500 mt-2">Instant Answers</p>
        </div>
      </div>
    </div>

    <div id="chat-container" class="chat-container">
      <div class="chat-wrapper" id="chat-wrapper"></div>
    </div>

    <div class="input-area-wrapper">
      <div class="input-container-main">
        <div id="mode-popup">
          <div class="mode-option active" data-mode="fast" onclick="setMode('fast')">
            <i data-lucide="zap" class="w-4 h-4 text-pink-400"></i>
            <span class="text-xs font-bold uppercase">Fast Mode</span>
          </div>
          <div class="mode-option" data-mode="deepthink" onclick="setMode('deepthink')">
            <i data-lucide="brain-circuit" class="w-4 h-4 text-amber-400"></i>
            <span class="text-xs font-bold uppercase">DeepThink</span>
          </div>
          <div class="mode-option" data-mode="canvas" onclick="setMode('canvas')">
            <i data-lucide="layout" class="w-4 h-4 text-indigo-400"></i>
            <span class="text-xs font-bold uppercase">Canvas</span>
          </div>
        </div>

        <div class="input-island">
          <button onclick="toggleModePopup(event)" class="mode-trigger-btn" id="active-mode-display">
            <i data-lucide="zap" class="w-4 h-4 text-pink-400"></i>
            <span>FAST</span>
            <i data-lucide="chevron-up" class="w-3 h-3 ml-1 opacity-50"></i>
          </button>

          <input id="user-input" placeholder="Ask DX-1 anything..." autocomplete="off" />

          <button onclick="handleSend()" class="bg-white text-black w-10 h-10 rounded-full flex items-center justify-center shadow-lg hover:scale-105 transition-transform">
            <i data-lucide="arrow-up" class="w-5 h-5"></i>
          </button>
        </div>
      </div>
      <div class="footer-disclaimer">DX-1 Neural OS can make mistakes. Verify important info. Built by DBNNAI.</div>
    </div>
  </section>

  <div id="preview-pane">
    <div class="flex items-center justify-between p-4 bg-slate-900 text-white">
      <div class="flex items-center gap-2">
        <i data-lucide="monitor" class="w-4 h-4 text-indigo-400"></i>
        <span class="text-xs font-bold uppercase tracking-widest">Live Preview</span>
      </div>
      <button onclick="closePreview()" class="hover:bg-white/10 p-2 rounded-full transition-colors">
        <i data-lucide="x" class="w-5 h-5"></i>
      </button>
    </div>
    <iframe id="preview-frame" class="w-full flex-1 border-none bg-white"></iframe>
  </div>
</div>

<script>
lucide.createIcons();

const renderer = new marked.Renderer();
renderer.code = function(code, language) {
  return `
    <div class="apple-code-wrapper">
      <div class="code-header">
        <div class="dot dot-red"></div>
        <div class="dot dot-yellow"></div>
        <div class="dot dot-green"></div>
        <span class="ml-auto text-[10px] text-slate-400 font-mono uppercase tracking-widest">${language || 'code'}</span>
      </div>
      <pre><code class="language-${language}">${code}</code></pre>
    </div>
  `;
};
marked.setOptions({ renderer, breaks: true });

const input = document.getElementById('user-input');
const wrapper = document.getElementById('chat-wrapper');
const chatContainer = document.getElementById('chat-container');
const hero = document.getElementById('hero-container');
const previewPane = document.getElementById('preview-pane');
const modePopup = document.getElementById('mode-popup');
const modeDisplay = document.getElementById('active-mode-display');
const BACKEND_URL = window.location.protocol === 'file:' ? "http://127.0.0.1:5000" : "";

let isTyping = false;
let currentMode = 'fast';

function toggleModePopup(e) {
  e.stopPropagation();
  modePopup.style.display = modePopup.style.display === 'flex' ? 'none' : 'flex';
}

document.addEventListener('click', () => { modePopup.style.display = 'none'; });

function setMode(mode) {
  currentMode = mode;
  const modes = {
    fast: { label: 'FAST', icon: 'zap', color: 'text-pink-400' },
    deepthink: { label: 'DEEPTHINK', icon: 'brain-circuit', color: 'text-amber-400' },
    canvas: { label: 'CANVAS', icon: 'layout', color: 'text-indigo-400' }
  };
  const m = modes[mode];
  modeDisplay.innerHTML = `<i data-lucide="${m.icon}" class="w-4 h-4 ${m.color}"></i><span>${m.label}</span><i data-lucide="chevron-up" class="w-3 h-3 ml-1 opacity-50"></i>`;
  document.querySelectorAll('.mode-option').forEach(opt => opt.classList.toggle('active', opt.dataset.mode === mode));
  lucide.createIcons();
  modePopup.style.display = 'none';
}

function quickSend(text) {
  input.value = text;
  handleSend();
}

async function handleSend() {
  const msg = input.value.trim();
  if(!msg || isTyping) return;

  if(hero.style.display !== 'none') {
    hero.style.opacity = '0';
    setTimeout(() => {
      hero.style.display = 'none';
      chatContainer.style.display = 'block';
    }, 400);
  }

  input.value = '';
  wrapper.insertAdjacentHTML('beforeend', `<div class="user-bubble text-white">${msg}</div>`);
  scrollToBottom();

  const aiId = 'ai-' + Date.now();
  wrapper.insertAdjacentHTML('beforeend', `
    <div class="ai-bubble">
      <div class="ai-avatar"><i data-lucide="cpu" class="text-indigo-400 w-5 h-5"></i></div>
      <div class="ai-content" id="${aiId}"><span class="cursor"></span></div>
    </div>`);
  lucide.createIcons();

  const aiDiv = document.getElementById(aiId);
  let fullText = "";

  try {
    isTyping = true;
    const response = await fetch(`${BACKEND_URL}/api/chat`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: msg, mode: currentMode })
    });

    const reader = response.body.getReader();
    const decoder = new TextDecoder();

    while (true) {
      const { value, done } = await reader.read();
      if (done) break;
      fullText += decoder.decode(value, { stream: true });
      aiDiv.innerHTML = marked.parse(fullText) + '<span class="cursor"></span>';
      scrollToBottom();
    }

    aiDiv.innerHTML = marked.parse(fullText);

    if(fullText.includes("<!DOCTYPE html>")) {
      const code = fullText.match(/<!DOCTYPE html>[\s\S]*?<\/html>/i)?.[0];
      if(code) {
        document.getElementById('preview-frame').srcdoc = code;
        document.getElementById('mobile-preview-trigger').style.display = 'block';
        if(window.innerWidth > 1024) togglePreview();
      }
    }
  } catch (e) {
    aiDiv.innerHTML = `<span class="text-red-400 text-xs">Pathways blocked. Check connection.</span>`;
  } finally {
    isTyping = false;
  }
}

function togglePreview() {
  previewPane.classList.toggle('active');
}

function closePreview() {
  previewPane.classList.remove('active');
}

function scrollToBottom() {
  chatContainer.scrollTop = chatContainer.scrollHeight;
}

const canvas = document.getElementById('neural-canvas');
const ctx = canvas.getContext('2d');
let points = [];
function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
window.addEventListener('resize', resize);
resize();
for(let i=0; i<30; i++) points.push({ x: Math.random()*canvas.width, y: Math.random()*canvas.height, vx: (Math.random()-0.5)*0.3, vy: (Math.random()-0.5)*0.3 });
function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  points.forEach((p, i) => {
    p.x += p.vx; p.y += p.vy;
    if(p.x < 0 || p.x > canvas.width) p.vx *= -1;
    if(p.y < 0 || p.y > canvas.height) p.vy *= -1;
    ctx.beginPath(); ctx.arc(p.x, p.y, 1.2, 0, Math.PI*2); ctx.fillStyle = i % 2 === 0 ? "rgba(59, 130, 246, 0.3)" : "rgba(239, 68, 68, 0.3)"; ctx.fill();
    for(let j=i+1; j<points.length; j++) {
      let d = Math.hypot(p.x - points[j].x, p.y - points[j].y);
      if(d < 180) { ctx.strokeStyle = i % 2 === 0 ? `rgba(59, 130, 246, ${0.1 * (1 - d/180)})` : `rgba(239, 68, 68, ${0.1 * (1 - d/180)})`; ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(points[j].x, points[j].y); ctx.stroke(); }
    }
  });
  requestAnimationFrame(draw);
}
draw();
input.onkeydown = e => { if (e.key === 'Enter') handleSend(); };
</script>
</body>
</html>
