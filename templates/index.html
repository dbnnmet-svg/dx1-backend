<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DX-1 | DBNN ULTRA</title>
    <!-- Tailwind CSS for Premium UI -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Marked for Markdown Parsing -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <!-- Highlight.js for Code Highlighting -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.7.0/styles/atom-one-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.7.0/highlight.min.js"></script>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;700&display=swap');

        body {
            font-family: 'Inter', sans-serif;
            background-color: #050505;
            color: #e2e8f0;
            overflow: hidden;
        }

        /* Mouse Glow Effect */
        #cursor-glow {
            position: fixed;
            width: 700px;
            height: 700px;
            background: radial-gradient(circle, rgba(59, 130, 246, 0.07) 0%, rgba(99, 102, 241, 0.02) 40%, rgba(0, 0, 0, 0) 70%);
            transform: translate(-50%, -50%);
            pointer-events: none;
            z-index: 0;
            transition: opacity 0.5s ease;
        }

        /* Glass Utility */
        .glass {
            background: rgba(15, 17, 21, 0.6);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.06);
        }

        /* Animations */
        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
        .msg-anim { animation: fadeIn 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards; }

        /* Live Cursor Effect */
        .cursor-active::after {
            content: '';
            display: inline-block;
            width: 4px;
            height: 1.1em;
            background: #3b82f6;
            margin-left: 2px;
            vertical-align: middle;
            animation: blink 0.4s infinite alternate;
        }
        @keyframes blink { from { opacity: 1; } to { opacity: 0; } }

        /* Markdown Overrides */
        .prose { max-width: none; }
        .prose pre { background: #0d1117 !important; border: 1px solid rgba(255,255,255,0.05); padding: 1rem !important; border-radius: 12px; }
        .prose code { color: #93c5fd; font-family: 'JetBrains Mono', monospace; }

        /* Dropdown Popup Animation */
        #mode-menu {
            transform-origin: bottom left;
            transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .menu-hidden { opacity: 0; transform: scale(0.9) translateY(10px); pointer-events: none; }
        .menu-visible { opacity: 1; transform: scale(1) translateY(0); pointer-events: auto; }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 10px; }
    </style>
</head>
<body class="h-screen flex flex-col relative selection:bg-blue-500/30">

    <!-- Ambient Background -->
    <div id="cursor-glow"></div>
    <div class="fixed top-0 left-0 w-full h-full bg-[url('https://grainy-gradients.vercel.app/noise.svg')] opacity-[0.03] pointer-events-none z-0"></div>

    <!-- Header Logo -->
    <div class="fixed top-6 left-6 z-50 flex items-center gap-3 select-none">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-blue-600 to-indigo-600 flex items-center justify-center font-bold text-white shadow-2xl shadow-blue-500/20">DX</div>
        <div class="flex flex-col">
            <span class="text-xs font-bold tracking-widest text-white/80 uppercase">Neural Link</span>
            <span class="text-[9px] text-blue-500 font-mono tracking-tighter">ULTRA_SYNC v4.8</span>
        </div>
    </div>

    <main class="flex-1 flex overflow-hidden relative z-10">

        <!-- Chat Area -->
        <div id="chat-container" class="flex-1 flex flex-col transition-all duration-300 relative">
            <div id="messages" class="flex-1 overflow-y-auto p-6 space-y-8 max-w-4xl mx-auto w-full z-10 scroll-smooth pb-40 pt-20">
                <!-- Welcome -->
                <div class="flex gap-4 items-start msg-anim">
                    <div class="w-8 h-8 rounded-lg flex-shrink-0 bg-white/5 border border-white/10 flex items-center justify-center text-[10px] font-bold text-blue-400">SYS</div>
                    <div class="glass border border-white/5 rounded-2xl rounded-tl-none p-5 max-w-[85%] text-gray-400 italic text-sm shadow-xl">
                        Neural interface initialized. All systems nominal.
                    </div>
                </div>
            </div>

            <!-- Input Area -->
            <div class="absolute bottom-8 left-0 w-full px-6 z-30">
                <div class="max-w-3xl mx-auto relative">

                    <!-- Mode Selector -->
                    <div id="mode-menu" class="absolute bottom-full left-0 mb-3 w-56 glass border border-white/10 rounded-2xl shadow-2xl p-1.5 z-50 menu-hidden">
                        <div class="text-[10px] font-bold text-gray-500 uppercase px-3 py-2 tracking-widest">Capabilities</div>
                        <button onclick="selectMode('chat', 'fa-comment-dots')" class="w-full text-left px-3 py-2.5 rounded-xl hover:bg-white/5 text-sm text-gray-300 hover:text-white transition-all flex items-center gap-3 group">
                            <i class="fas fa-comment-dots text-blue-400 w-5"></i> Chat Mode
                        </button>
                        <button onclick="selectMode('canvas', 'fa-code')" class="w-full text-left px-3 py-2.5 rounded-xl hover:bg-white/5 text-sm text-gray-300 hover:text-white transition-all flex items-center gap-3 group">
                            <i class="fas fa-code text-purple-400 w-5"></i> Canvas Mode
                        </button>
                        <button onclick="selectMode('study', 'fa-graduation-cap')" class="w-full text-left px-3 py-2.5 rounded-xl hover:bg-white/5 text-sm text-gray-300 hover:text-white transition-all flex items-center gap-3 group">
                            <i class="fas fa-graduation-cap text-green-400 w-5"></i> Study Mode
                        </button>
                        <button onclick="selectMode('deep_research', 'fa-brain')" class="w-full text-left px-3 py-2.5 rounded-xl hover:bg-white/5 text-sm text-gray-300 hover:text-white transition-all flex items-center gap-3 group">
                            <i class="fas fa-brain text-orange-400 w-5"></i> Deep Research
                        </button>
                    </div>

                    <!-- Input Bar -->
                    <div class="relative flex items-end glass rounded-2xl border border-white/10 shadow-2xl overflow-hidden group focus-within:border-blue-500/30 transition-all">
                        <button onclick="toggleModeMenu()" id="mode-trigger" class="h-14 w-14 flex items-center justify-center text-blue-400 hover:text-white transition-colors border-r border-white/5 group-hover:bg-white/5">
                            <i class="fas fa-comment-dots text-lg" id="current-mode-icon"></i>
                        </button>

                        <textarea id="user-input" rows="1" class="flex-1 bg-transparent text-gray-200 pl-4 pr-14 py-4 focus:outline-none resize-none placeholder-gray-600 max-h-48 leading-relaxed text-sm" placeholder="Initialize command..."></textarea>

                        <button onclick="sendMessage()" class="absolute right-2 bottom-2 h-10 w-10 bg-blue-600 hover:bg-blue-500 text-white rounded-xl transition-all shadow-lg active:scale-90 flex items-center justify-center">
                            <i class="fas fa-arrow-up text-sm"></i>
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Preview Panel -->
        <div id="preview-panel" class="w-0 bg-[#0d1117] border-l border-white/5 transition-all duration-500 ease-[cubic-bezier(0.16,1,0.3,1)] flex flex-col z-40">
            <div class="h-14 border-b border-white/5 flex items-center justify-between px-6 bg-[#050505]">
                <div class="flex items-center gap-3">
                    <div class="w-2 h-2 rounded-full bg-blue-500 animate-pulse"></div>
                    <span class="text-xs font-bold text-gray-400 uppercase tracking-widest">Output Buffer</span>
                </div>
                <button onclick="togglePreview(false)" class="text-gray-500 hover:text-white transition-colors"><i class="fas fa-times"></i></button>
            </div>
            <div id="preview-content" class="flex-1 overflow-auto relative bg-[#0d1117]"></div>
        </div>

    </main>

    <script>
        let currentMode = 'chat';
        let conversationHistory = [];
        let isGenerating = false;

        // Mouse Tracker
        document.addEventListener('mousemove', (e) => {
            const glow = document.getElementById('cursor-glow');
            requestAnimationFrame(() => {
                glow.style.left = e.clientX + 'px';
                glow.style.top = e.clientY + 'px';
            });
        });

        function toggleModeMenu() {
            const menu = document.getElementById('mode-menu');
            menu.classList.toggle('menu-hidden');
            menu.classList.toggle('menu-visible');
        }

        function togglePreview(show) {
            const p = document.getElementById('preview-panel');
            p.style.width = show ? '45%' : '0';
        }

        function selectMode(mode, iconClass) {
            currentMode = mode;
            document.getElementById('current-mode-icon').className = `fas ${iconClass}`;

            const icon = document.getElementById('current-mode-icon');
            icon.className = `fas ${iconClass} text-lg ` + (
                mode === 'chat' ? 'text-blue-400' :
                mode === 'canvas' ? 'text-purple-400' :
                mode === 'study' ? 'text-green-400' : 'text-orange-400'
            );

            toggleModeMenu();
            if (mode === 'canvas' || mode === 'study') togglePreview(true);
            else togglePreview(false);
        }

        const textarea = document.getElementById('user-input');
        textarea.addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = (this.scrollHeight) + 'px';
        });

        textarea.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
        });

        async function sendMessage() {
            const message = textarea.value.trim();
            if (!message || isGenerating) return;

            addMessageToUI('user', message);
            textarea.value = '';
            textarea.style.height = 'auto';
            isGenerating = true;

            const aiBubble = addMessageToUI('ai', '');
            aiBubble.classList.add('cursor-active');

            let fullResponse = "";
            let displayedLength = 0;
            let streamFinished = false;

            try {
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message, mode: currentMode, history: conversationHistory })
                });

                const reader = response.body.getReader();
                const decoder = new TextDecoder();

                const streamProcessor = async () => {
                    try {
                        while (true) {
                            const { done, value } = await reader.read();
                            if (done) break;
                            fullResponse += decoder.decode(value);
                        }
                    } finally {
                        streamFinished = true;
                    }
                };

                streamProcessor();

                const renderLoop = () => {
                    if (displayedLength < fullResponse.length || !streamFinished) {
                        if (displayedLength < fullResponse.length) {
                            // High speed typing logic
                            const delta = fullResponse.length - displayedLength;
                            const chunkSize = Math.max(2, Math.floor(delta / 4));
                            displayedLength += chunkSize;

                            // Only parse markdown for the displayed portion
                            if (currentMode !== 'study') {
                                aiBubble.innerHTML = marked.parse(fullResponse.substring(0, displayedLength));
                            } else {
                                aiBubble.innerHTML = `<span class="italic text-gray-500">Processing structured data stream...</span>`;
                            }
                            scrollToBottom();
                        }
                        requestAnimationFrame(renderLoop);
                    } else {
                        finalizeResponse(fullResponse, aiBubble);
                    }
                };

                requestAnimationFrame(renderLoop);

            } catch (error) {
                aiBubble.innerHTML = `<span class="text-red-400">Connection Failed: Check Backend.</span>`;
                isGenerating = false;
            }
        }

        function finalizeResponse(text, bubble) {
            bubble.classList.remove('cursor-active');
            if (currentMode === 'study') {
                renderStudyMode(text, bubble);
            } else {
                bubble.innerHTML = marked.parse(text);
                hljs.highlightAll();
            }

            conversationHistory.push({ role: "assistant", content: text });
            isGenerating = false;

            if (currentMode === 'canvas') extractAndRenderHTML(text);
            scrollToBottom();
        }

        function addMessageToUI(role, content) {
            const container = document.getElementById('messages');
            const wrapper = document.createElement('div');
            wrapper.className = `flex gap-4 msg-anim ${role === 'user' ? 'flex-row-reverse' : ''}`;

            const avatar = document.createElement('div');
            avatar.className = `w-8 h-8 rounded-lg flex-shrink-0 flex items-center justify-center font-bold text-[10px] text-white ${role === 'user' ? 'bg-white/10' : 'bg-gradient-to-br from-blue-600 to-indigo-600'}`;
            avatar.textContent = role === 'user' ? 'U' : 'DX';

            const bubble = document.createElement('div');
            bubble.className = `p-4 max-w-[85%] rounded-2xl shadow-xl prose prose-invert text-sm ${role === 'user' ? 'bg-blue-600 text-white rounded-tr-none' : 'glass text-gray-200 rounded-tl-none'}`;
            bubble.innerHTML = content;

            wrapper.appendChild(avatar);
            wrapper.appendChild(bubble);
            container.appendChild(wrapper);

            if (role === 'user') conversationHistory.push({ role: "user", content: content });
            scrollToBottom();
            return bubble;
        }

        function scrollToBottom() {
            const container = document.getElementById('messages');
            container.scrollTo({ top: container.scrollHeight, behavior: 'smooth' });
        }

        function extractAndRenderHTML(text) {
            const match = text.match(/```html([\s\S]*?)```/);
            if (match && match[1]) {
                const previewContainer = document.getElementById('preview-content');
                previewContainer.innerHTML = `<iframe class="w-full h-full bg-white border-none"></iframe>`;
                const doc = previewContainer.querySelector('iframe').contentWindow.document;
                doc.open(); doc.write(match[1]); doc.close();
            }
        }

        function renderStudyMode(text, msgDiv) {
            const jsonMatch = text.match(/```json([\s\S]*?)```/);
            if (jsonMatch && jsonMatch[1]) {
                try {
                    const data = JSON.parse(jsonMatch[1]);
                    msgDiv.innerHTML = "<div class='flex items-center gap-2 text-green-400'><i class='fas fa-check-circle'></i> <span>Learning Module Synthesized.</span></div>";
                    const preview = document.getElementById('preview-content');
                    preview.innerHTML = `<div class="p-8 space-y-6"></div>`;
                    const container = preview.firstChild;

                    data.forEach((item, i) => {
                        const card = document.createElement('div');
                        card.className = "bg-[#161b22] p-6 rounded-2xl border border-white/5 shadow-2xl msg-anim";
                        card.style.animationDelay = `${i * 0.1}s`;

                        if (item.type === 'slide') {
                            card.innerHTML = `<h3 class="text-blue-400 font-bold mb-2">${item.title}</h3><p class="text-gray-400 text-sm leading-relaxed">${item.content}</p>`;
                        } else {
                            card.innerHTML = `<h3 class="text-white text-sm font-bold mb-4">Quiz: ${item.question}</h3><div class="space-y-2">
                                ${item.options.map((o, idx) => `<button onclick="checkAnswer(this, ${idx}, ${item.answer})" class="w-full text-left p-3 rounded-xl bg-white/5 border border-white/5 text-xs hover:bg-white/10 transition-all">${o}</button>`).join('')}
                            </div><div class="mt-3 text-xs font-bold hidden result"></div>`;
                        }
                        container.appendChild(card);
                    });
                } catch(e) { msgDiv.innerHTML = marked.parse(text); }
            } else msgDiv.innerHTML = marked.parse(text);
        }

        window.checkAnswer = function(btn, sel, cor) {
            const parent = btn.parentElement;
            const res = parent.nextElementSibling;
            const btns = parent.querySelectorAll('button');
            btns.forEach(b => b.disabled = true);
            if(sel === cor) {
                btn.className = "w-full text-left p-3 rounded-xl bg-emerald-500/20 border border-emerald-500 text-emerald-400 text-xs";
                res.textContent = "VERIFIED"; res.className = "mt-3 text-xs font-bold text-emerald-400";
            } else {
                btn.className = "w-full text-left p-3 rounded-xl bg-red-500/20 border border-red-500 text-red-400 text-xs";
                btns[cor].className = "w-full text-left p-3 rounded-xl bg-emerald-500/20 border border-emerald-500 text-emerald-400 text-xs";
                res.textContent = "FAILED"; res.className = "mt-3 text-xs font-bold text-red-400";
            }
            res.classList.remove('hidden');
        }
    </script>
</body>
</html>
