<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DBNN DX-1 | Neural OS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500&family=Inter:wght@400;600&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-deep: #020208;
            --glass: rgba(10, 10, 20, 0.7);
            --primary: #6366f1;
            --accent-pink: #f43f5e;
            --accent-cyan: #22d3ee;
            --accent-purple: #a855f7;
        }

        body {
            background: var(--bg-deep);
            color: #e2e8f0;
            font-family: 'Inter', sans-serif;
            height: 100vh;
            overflow: hidden;
            display: flex;
            margin: 0;
        }

        /* THE FIX: Background set to ignore ALL mouse interaction */
        #neural-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
            background: radial-gradient(circle at 50% 50%, #0d0d2b 0%, #020208 100%);
        }

        /* Layout container ignores clicks but passes them to children */
        #main-layout {
            position: relative;
            z-index: 10;
            display: flex;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        /* Elements that NEED to be clickable */
        #chat-section, .input-island, .suggestion-card, .user-bubble, .action-icon-btn, .mode-item, #send-btn, #user-input, .preview-header button {
            pointer-events: auto;
        }

        #chat-section { flex: 1; display: flex; flex-direction: column; height: 100%; position: relative; min-width: 0; }
        .chat-container { flex: 1; overflow-y: auto; padding: 20px; scroll-behavior: smooth; }
        .chat-wrapper { max-width: 850px; margin: 0 auto; display: flex; flex-direction: column; padding-bottom: 20px; }

        /* Bubbles */
        .user-bubble { background: var(--primary); padding: 12px 18px; border-radius: 18px 18px 4px 18px; align-self: flex-end; margin-bottom: 20px; box-shadow: 0 4px 15px rgba(99, 102, 241, 0.4); max-width: 85%; border: 1px solid rgba(255,255,255,0.1); }
        .ai-bubble { display: flex; gap: 12px; margin-bottom: 24px; width: 100%; }
        .ai-avatar { width: 38px; height: 38px; border-radius: 12px; background: linear-gradient(135deg, var(--primary), var(--accent-purple)); display: flex; align-items: center; justify-content: center; flex-shrink: 0; box-shadow: 0 0 20px rgba(99, 102, 241, 0.5); }
        .ai-content { flex: 1; font-size: 15px; line-height: 1.6; color: #cbd5e1; min-width: 0; }

        /* Suggestions */
        #suggestions-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; margin-top: 20px; }
        .suggestion-card { background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 16px; padding: 16px; cursor: pointer; transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1); display: flex; flex-direction: column; gap: 8px; backdrop-filter: blur(10px); }
        .suggestion-card:hover { background: rgba(99, 102, 241, 0.2); border-color: var(--primary); transform: translateY(-4px); box-shadow: 0 10px 25px rgba(0,0,0,0.4); }

        /* Input Island */
        .input-area-wrapper { width: 100%; padding: 20px 20px 40px 20px; background: linear-gradient(to top, var(--bg-deep) 60%, transparent); display: flex; justify-content: center; pointer-events: none; }
        .input-island {
            width: 100%;
            max-width: 800px;
            background: var(--glass);
            backdrop-filter: blur(30px);
            border: 1px solid rgba(255,255,255,0.18);
            border-radius: 30px;
            padding: 10px 22px;
            display: flex;
            align-items: center;
            gap: 14px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.6), 0 0 40px rgba(99, 102, 241, 0.15);
            position: relative;
        }
        input {
            background: transparent;
            border: none;
            flex: 1;
            color: white;
            outline: none;
            font-size: 16px;
            height: 50px;
            cursor: text;
        }

        /* Mode Menu */
        #mode-menu { position: absolute; bottom: 120px; left: 50%; transform: translateX(-50%); background: #0a0a1a; border: 1px solid #333; border-radius: 20px; padding: 10px; display: none; flex-direction: column; z-index: 100; min-width: 220px; box-shadow: 0 25px 70px rgba(0,0,0,0.9); pointer-events: auto; }
        #mode-menu.active { display: flex; }
        .mode-item { padding: 12px 16px; border-radius: 12px; cursor: pointer; display: flex; align-items: center; gap: 12px; font-size: 14px; transition: 0.2s; color: #94a3b8; }
        .mode-item:hover { background: rgba(255,255,255,0.08); color: white; }
        .mode-item.selected { background: var(--primary); color: white; }

        /* Preview Pane */
        #preview-pane { position: absolute; right: 0; top: 0; width: 0; height: 100%; background: white; transition: width 0.6s cubic-bezier(0.16, 1, 0.3, 1); z-index: 50; border-left: 1px solid #333; overflow: hidden; display: flex; flex-direction: column; pointer-events: auto; }
        #preview-pane.active { width: 50%; }
        .preview-header { padding: 12px 16px; background: #000; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #222; }
        iframe { width: 100%; flex: 1; border: none; background: white; }

        @media (max-width: 1024px) { #preview-pane.active { width: 100%; } }
    </style>
</head>
<body>
    <canvas id="neural-canvas"></canvas>

    <div id="main-layout">
        <section id="chat-section">
            <div id="chat-container" class="chat-container">
                <div class="chat-wrapper" id="chat-wrapper">
                    <div class="ai-bubble">
                        <div class="ai-avatar"><i data-lucide="sparkles" class="text-white w-5 h-5"></i></div>
                        <div class="ai-content">
                            <p><strong>Neural Link Established.</strong> I am DX-1 🚀. Hmmm... mmm, let's see. The grid is vibrant and ready for your input! What are we creating?</p>
                            <div id="suggestions-grid">
                                <div class="suggestion-card" onclick="useSuggestion('Make me a retro space shooter game with high-end physics', 'canvas', 'layout')">
                                    <i data-lucide="gamepad-2" class="text-indigo-400 w-5 h-5"></i>
                                    <span class="text-sm font-semibold">Build a Game</span>
                                    <span class="text-xs text-gray-400">Mode: Canvas</span>
                                </div>
                                <div class="suggestion-card" onclick="useSuggestion('Generate a professional animated PPT about Artificial Intelligence in 2026', 'study', 'book')">
                                    <i data-lucide="presentation" class="text-pink-400 w-5 h-5"></i>
                                    <span class="text-sm font-semibold">Design a Presentation</span>
                                    <span class="text-xs text-gray-400">Mode: Study</span>
                                </div>
                                <div class="suggestion-card" onclick="useSuggestion('Tell me a deep, immersive story about an AI discovering emotions', 'fast', 'zap')">
                                    <i data-lucide="scroll-text" class="text-cyan-400 w-5 h-5"></i>
                                    <span class="text-sm font-semibold">Write a Story</span>
                                    <span class="text-xs text-gray-400">Mode: Fast Chat</span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div id="mode-menu">
                <div id="mode-fast" class="mode-item selected" onclick="changeMode('fast', 'zap')"><i data-lucide="zap" class="w-4 h-4 text-indigo-400"></i> Fast Chat</div>
                <div id="mode-canvas" class="mode-item" onclick="changeMode('canvas', 'layout')"><i data-lucide="layout" class="w-4 h-4 text-pink-400"></i> Canvas Mode</div>
                <div id="mode-study" class="mode-item" onclick="changeMode('study', 'book')"><i data-lucide="book" class="w-4 h-4 text-cyan-400"></i> Study Mode</div>
            </div>

            <div class="input-area-wrapper">
                <div class="input-island">
                    <button onclick="toggleModeMenu()" class="text-indigo-400 hover:text-white transition"><i id="mode-icon" data-lucide="zap" class="w-5 h-5"></i></button>
                    <input id="user-input" placeholder="Type your neural command..." autocomplete="off">
                    <button id="send-btn" onclick="handleSend()" class="bg-indigo-600 p-2.5 rounded-full text-white hover:bg-indigo-500 hover:scale-110 active:scale-90 transition-all shadow-lg shadow-indigo-500/40"><i data-lucide="arrow-up" class="w-5 h-5"></i></button>
                </div>
            </div>
        </section>

        <div id="preview-pane">
            <div class="preview-header">
                <span id="preview-title" class="text-[10px] text-gray-500 font-mono tracking-widest uppercase">Live DX-1 Render</span>
                <button onclick="closePreview()" class="text-white bg-red-500 hover:bg-red-600 w-8 h-8 flex items-center justify-center rounded-full"><i data-lucide="x" class="w-4 h-4"></i></button>
            </div>
            <iframe id="preview-frame"></iframe>
        </div>
    </div>

    <script>
        lucide.createIcons();
        let currentMode = 'fast';
        let isTyping = false;
        let conversationHistory = [];

        function toggleModeMenu() { document.getElementById('mode-menu').classList.toggle('active'); }

        function changeMode(mode, icon) {
            currentMode = mode;
            const iconEl = document.getElementById('mode-icon');
            iconEl.setAttribute('data-lucide', icon);
            lucide.createIcons();
            document.querySelectorAll('.mode-item').forEach(el => el.classList.remove('selected'));
            document.getElementById(`mode-${mode}`).classList.add('selected');
            document.getElementById('mode-menu').classList.remove('active');
            document.getElementById('user-input').focus();
        }

        function useSuggestion(text, mode, icon) {
            changeMode(mode, icon);
            document.getElementById('user-input').value = text;
            handleSend();
        }

        async function handleSend() {
            const input = document.getElementById('user-input');
            const msg = input.value.trim();
            if(!msg || isTyping) return;

            const grid = document.getElementById('suggestions-grid');
            if(grid) grid.remove();

            const wrapper = document.getElementById('chat-wrapper');
            wrapper.innerHTML += `<div class="user-bubble">${msg}</div>`;
            input.value = '';
            scrollToBottom();

            const aiId = 'ai-' + Date.now();
            wrapper.innerHTML += `
                <div class="ai-bubble">
                    <div class="ai-avatar"><i data-lucide="zap" class="text-white w-5 h-5"></i></div>
                    <div class="ai-content" id="${aiId}"><span class="animate-pulse">mmm... processing... 🚀</span></div>
                </div>`;
            lucide.createIcons();

            try {
                isTyping = true;
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        message: msg,
                        mode: currentMode,
                        history: conversationHistory
                    })
                });

                const data = await response.json();
                if (data.error) throw new Error(data.error);

                const fullText = data.response;
                conversationHistory.push({role: "user", content: msg});
                conversationHistory.push({role: "assistant", content: fullText});

                document.getElementById(aiId).innerHTML = "";
                startMixedTyping(aiId, fullText);
            } catch (e) {
                document.getElementById(aiId).innerHTML = `<div class="text-red-400 p-3 border border-red-900/50 rounded bg-red-900/20 font-mono text-xs">DX-1 ERROR: Connection to Flask server lost. Mmm... yep, check your terminal! 🚀</div>`;
                isTyping = false;
            }
        }

        function startMixedTyping(id, fullText) {
            const el = document.getElementById(id);
            const segments = fullText.split(/(```[\s\S]*?```)/g);
            let segmentIndex = 0;

            function next() {
                if (segmentIndex >= segments.length) {
                    finish(el, fullText);
                    return;
                }
                let seg = segments[segmentIndex];
                if (seg.startsWith('```')) {
                    el.innerHTML += marked.parse(seg);
                    segmentIndex++;
                    hljs.highlightAll();
                    next();
                } else {
                    typeText(seg, () => { segmentIndex++; next(); });
                }
            }

            function typeText(text, cb) {
                let i = 0;
                const interval = setInterval(() => {
                    if (i < text.length) {
                        let partial = segments.slice(0, segmentIndex).join("") + text.substring(0, i + 1);
                        el.innerHTML = marked.parse(partial);
                        i++;
                        if (i % 8 === 0) scrollToBottom();
                    } else {
                        clearInterval(interval);
                        cb();
                    }
                }, 4);
            }
            next();
        }

        function finish(el, text) {
            isTyping = false;
            el.innerHTML = marked.parse(text);
            hljs.highlightAll();

            let lastCode = null;
            el.querySelectorAll('pre').forEach(pre => {
                const code = pre.querySelector('code').innerText;
                const bar = document.createElement('div');
                bar.className = 'code-action-bar';

                const copyBtn = createActionBtn('copy', () => {
                    navigator.clipboard.writeText(code);
                    copyBtn.innerHTML = '<i data-lucide="check"></i>';
                    setTimeout(() => { copyBtn.innerHTML = '<i data-lucide="copy"></i>'; lucide.createIcons(); }, 1500);
                    lucide.createIcons();
                });

                bar.appendChild(copyBtn);
                if (code.toLowerCase().includes('<!doctype html>') || code.toLowerCase().includes('<html')) {
                    const playBtn = createActionBtn('play', () => openPreview(code));
                    bar.appendChild(playBtn);
                    lastCode = code;
                }
                pre.appendChild(bar);
            });

            if (lastCode && (currentMode === 'canvas' || currentMode === 'study')) openPreview(lastCode);
            lucide.createIcons();
            scrollToBottom();
            document.getElementById('user-input').focus();
        }

        function createActionBtn(icon, onClick) {
            const btn = document.createElement('div');
            btn.className = 'action-icon-btn';
            btn.innerHTML = `<i data-lucide="${icon}"></i>`;
            btn.onclick = (e) => { e.stopPropagation(); onClick(); };
            return btn;
        }

        function openPreview(html) {
            document.getElementById('preview-pane').classList.add('active');
            document.getElementById('preview-frame').srcdoc = html;
        }

        function closePreview() {
            document.getElementById('preview-pane').classList.remove('active');
            document.getElementById('preview-frame').srcdoc = "";
        }

        function scrollToBottom() {
            const c = document.getElementById('chat-container');
            c.scrollTop = c.scrollHeight;
        }

        // --- ENHANCED COLORFUL NEURAL BACKGROUND ---
        const canvas = document.getElementById('neural-canvas');
        const ctx = canvas.getContext('2d');
        let pts = [];
        const colors = ['#6366f1', '#f43f5e', '#22d3ee', '#a855f7', '#fbbf24'];

        window.onresize = () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        };
        window.onresize();

        for(let i=0; i<70; i++) {
            pts.push({
                x: Math.random()*canvas.width,
                y: Math.random()*canvas.height,
                vx: (Math.random()-0.5)*0.6,
                vy: (Math.random()-0.5)*0.6,
                color: colors[Math.floor(Math.random()*colors.length)],
                size: Math.random() * 2 + 1.5,
                glow: Math.random() * 15 + 5
            });
        }

        function draw() {
            ctx.clearRect(0,0,canvas.width,canvas.height);

            // Draw connections with slight color blending
            ctx.lineWidth = 0.6;
            for(let i=0; i<pts.length; i++) {
                for(let j=i+1; j<pts.length; j++) {
                    const dx = pts[i].x - pts[j].x;
                    const dy = pts[i].y - pts[j].y;
                    const dist = Math.sqrt(dx*dx + dy*dy);
                    if(dist < 160) {
                        const alpha = (1 - dist/160) * 0.4;
                        ctx.strokeStyle = `rgba(99, 102, 241, ${alpha})`;
                        ctx.beginPath();
                        ctx.moveTo(pts[i].x, pts[i].y);
                        ctx.lineTo(pts[j].x, pts[j].y);
                        ctx.stroke();
                    }
                }
            }

            // Draw glowing points
            pts.forEach(p => {
                p.x += p.vx; p.y += p.vy;
                if(p.x<0||p.x>canvas.width) p.vx*=-1;
                if(p.y<0||p.y>canvas.height) p.vy*=-1;

                ctx.fillStyle = p.color;
                ctx.shadowBlur = p.glow;
                ctx.shadowColor = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI*2);
                ctx.fill();
                ctx.shadowBlur = 0;
            });
            requestAnimationFrame(draw);
        }
        draw();

        // Final Fix: Force focus on start and ensure Enter key works
        document.getElementById('user-input').onkeydown = e => {
            if(e.key === 'Enter') {
                e.preventDefault();
                handleSend();
            }
        };

        window.addEventListener('mousedown', (e) => {
           // Allow clicks only to bubble up if not on background
        });

        window.onload = () => {
            document.getElementById('user-input').focus();
            // Re-check focus after a tiny delay to bypass browser lock
            setTimeout(() => document.getElementById('user-input').focus(), 500);
        };
    </script>
</body>
</html>
