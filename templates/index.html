<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>DX-1 | DBNNAI Neural OS</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark-dimmed.min.css" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet" />

    <style>
        :root {
            --bg: #020205;
            --red: #ff3e3e;
            --blue: #3e8bff;
            --glass: rgba(255, 255, 255, 0.03);
            --border: rgba(255, 255, 255, 0.08);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: var(--bg); color: #f8fafc; font-family: 'Inter', sans-serif; height: 100vh; overflow: hidden; }

        #neural-canvas { position: fixed; top: 0; left: 0; z-index: 1; opacity: 0.35; pointer-events: none; }
        .glow { position: fixed; width: 60vw; height: 60vw; border-radius: 50%; filter: blur(140px); z-index: 0; opacity: 0.12; pointer-events: none; }
        .red-glow { top: -20%; left: -10%; background: var(--red); }
        .blue-glow { bottom: -20%; right: -10%; background: var(--blue); }

        #main-layout { position: relative; z-index: 10; display: flex; width: 100vw; height: 100vh; }
        #chat-section { flex: 1; display: flex; flex-direction: column; height: 100%; position: relative; z-index: 10; }

        .dx-logo {
            font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 5.5rem; letter-spacing: -4px;
            background: linear-gradient(to right, var(--blue), var(--red));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 30px rgba(62, 139, 255, 0.3));
        }

        .chat-container { flex: 1; overflow-y: auto; padding: 25px; display: none; scroll-behavior: smooth; z-index: 20; }
        .chat-wrapper { max-width: 850px; margin: 0 auto; display: flex; flex-direction: column; padding-bottom: 160px; }

        .user-bubble {
            align-self: flex-end; background: var(--glass); border: 1px solid var(--border);
            padding: 15px 24px; border-radius: 25px 25px 4px 25px; max-width: 80%;
            margin-bottom: 30px; backdrop-filter: blur(10px); font-size: 0.95rem;
        }

        .ai-bubble { display: flex; gap: 18px; margin-bottom: 35px; animation: slideUp 0.4s ease; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }

        .ai-avatar {
            width: 44px; height: 44px; border-radius: 14px; background: #000;
            border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; flex-shrink: 0;
        }
        .ai-avatar.pro { border-color: var(--red); box-shadow: 0 0 15px rgba(255, 62, 62, 0.3); }
        .ai-avatar.std { border-color: var(--blue); box-shadow: 0 0 15px rgba(62, 139, 255, 0.3); }

        .thinking-std { font-size: 11px; font-weight: 800; color: var(--blue); text-transform: uppercase; letter-spacing: 2px; }
        .thinking-pro { width: 160px; height: 3px; background: rgba(255, 62, 62, 0.1); border-radius: 4px; overflow: hidden; position: relative; }
        .pro-bar { width: 40%; height: 100%; background: var(--red); position: absolute; animation: pro-flow 1.5s infinite ease-in-out; }
        @keyframes pro-flow { from { left: -50%; } to { left: 120%; } }

        .input-area {
            position: absolute; bottom: 0; left: 0; width: 100%; padding: 40px 20px;
            background: linear-gradient(to top, var(--bg) 80%, transparent);
            display: flex; justify-content: center; z-index: 100;
            pointer-events: none;
        }

        .input-container-main { width: 100%; max-width: 800px; position: relative; pointer-events: auto; }

        .input-island {
            background: rgba(10, 10, 15, 0.85); backdrop-filter: blur(30px); border: 1px solid var(--border);
            border-radius: 40px; padding: 10px 12px 10px 20px; display: flex; align-items: center; gap: 12px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.5);
        }

        input { background: transparent; border: none; flex: 1; color: #fff; outline: none; font-size: 16px; min-height: 30px; }

        .pop-menu { position: absolute; bottom: calc(100% + 15px); background: #0a0a0f; border: 1px solid var(--border); border-radius: 20px; padding: 10px; display: none; flex-direction: column; min-width: 180px; z-index: 200; box-shadow: 0 20px 50px rgba(0,0,0,0.6); }
        .pop-item { padding: 12px 15px; border-radius: 12px; cursor: pointer; display: flex; align-items: center; gap: 10px; font-size: 11px; font-weight: 700; color: #666; transition: 0.2s; }
        .pop-item:hover, .pop-item.active { background: rgba(255,255,255,0.05); color: #fff; }

        #preview-pane { position: absolute; top: 0; right: -100%; width: 50vw; height: 100%; background: #fff; transition: right 0.5s cubic-bezier(0.16, 1, 0.3, 1); border-left: 1px solid var(--border); z-index: 50; display: flex; flex-direction: column; box-shadow: -20px 0 50px rgba(0,0,0,0.5); }
        #preview-pane.active { right: 0; }

        pre code { font-family: 'Fira Code', monospace !important; font-size: 13px !important; border-radius: 12px; padding: 16px !important; background: #08080c !important; border: 1px solid var(--border); display: block; overflow-x: auto; margin: 10px 0;}
        .markdown-content p { margin-bottom: 12px; }
    </style>
</head>
<body>
    <div class="glow red-glow"></div>
    <div class="glow blue-glow"></div>
    <canvas id="neural-canvas"></canvas>

    <div id="main-layout">
        <section id="chat-section">
            <div id="hero" class="flex-1 flex flex-col items-center justify-center text-center p-6">
                <div class="dx-logo">DX-1</div>
                <p class="text-slate-500 tracking-[0.6em] text-[10px] font-bold uppercase mb-12">Deep Brain Neural Network</p>
                <div class="flex gap-4">
                    <button class="bg-white/5 border border-white/5 px-8 py-4 rounded-full text-[10px] font-bold uppercase tracking-widest hover:border-blue-500/50 hover:bg-white/10 transition" onclick="setMode('deepthink')">Deep Analysis</button>
                    <button class="bg-white/5 border border-white/5 px-8 py-4 rounded-full text-[10px] font-bold uppercase tracking-widest hover:border-red-500/50 hover:bg-white/10 transition" onclick="setMode('canvas')">Canvas Forge</button>
                </div>
            </div>

            <div id="chat-container" class="chat-container">
                <div class="chat-wrapper" id="chat-wrapper"></div>
            </div>

            <div class="input-area">
                <div class="input-container-main">
                    <div id="model-pop" class="pop-menu left-0">
                        <div class="pop-item active" onclick="setModel('dx1')"><i data-lucide="cpu" class="w-4 h-4 text-blue-400"></i> DX-1 Standard</div>
                        <div class="pop-item" onclick="setModel('pro')"><i data-lucide="shield" class="w-4 h-4 text-red-400"></i> DX-1 PRO Core</div>
                    </div>

                    <div id="mode-pop" class="pop-menu left-[20%]">
                        <div class="pop-item active" onclick="setMode('fast')"><i data-lucide="zap" class="w-4 h-4 text-yellow-400"></i> FAST</div>
                        <div class="pop-item" onclick="setMode('deepthink')"><i data-lucide="brain" class="w-4 h-4 text-purple-400"></i> DEEPTHINK</div>
                        <div class="pop-item" onclick="setMode('canvas')"><i data-lucide="layout" class="w-4 h-4 text-emerald-400"></i> CANVAS</div>
                    </div>

                    <div class="input-island">
                        <button onclick="togglePop('model-pop', event)" id="model-display" class="bg-white/5 border border-white/10 px-4 py-2.5 rounded-full text-[10px] font-bold uppercase flex items-center gap-2 hover:bg-white/10 transition">
                            <i data-lucide="cpu" class="w-3.5 h-3.5 text-blue-400"></i> DX-1
                        </button>
                        <button onclick="togglePop('mode-pop', event)" id="mode-display" class="bg-white/5 border border-white/10 px-4 py-2.5 rounded-full text-[10px] font-bold uppercase flex items-center gap-2 hover:bg-white/10 transition">
                            <i data-lucide="zap" class="w-3.5 h-3.5 text-yellow-400"></i> FAST
                        </button>

                        <input type="text" id="user-input" placeholder="Initiate neural link..." autocomplete="off" />

                        <button onclick="handleSend()" class="bg-white text-black p-3 rounded-full hover:scale-105 active:scale-95 transition">
                            <i data-lucide="arrow-up" class="w-5 h-5"></i>
                        </button>
                    </div>
                    <p class="text-center mt-5 text-[8px] text-slate-700 tracking-[0.5em] font-black uppercase">DBNNAI Neural OS</p>
                </div>
            </div>
        </section>

        <aside id="preview-pane">
            <div class="bg-slate-100 p-4 border-b flex justify-between items-center">
                <div class="flex items-center gap-2 text-black">
                    <i data-lucide="monitor" class="w-4 h-4"></i>
                    <span class="text-[10px] font-bold uppercase tracking-widest">Neural Canvas Preview</span>
                </div>
                <button class="close-btn text-black" onclick="closePreview()"><i data-lucide="x" class="w-5 h-5"></i></button>
            </div>
            <iframe id="preview-frame" class="w-full h-full bg-white border-none flex-1"></iframe>
        </aside>
    </div>

    <script>
        lucide.createIcons();

        let currentModel = 'dx1', currentMode = 'fast';
        const input = document.getElementById('user-input');
        const wrapper = document.getElementById('chat-wrapper');
        const container = document.getElementById('chat-container');
        const preview = document.getElementById('preview-pane');

        function togglePop(id, event) {
            event.stopPropagation();
            const el = document.getElementById(id);
            const isVisible = el.style.display === 'flex';
            document.querySelectorAll('.pop-menu').forEach(p => p.style.display = 'none');
            el.style.display = isVisible ? 'none' : 'flex';
        }

        document.addEventListener('click', () => {
            document.querySelectorAll('.pop-menu').forEach(p => p.style.display = 'none');
        });

        function setModel(m) {
            currentModel = m;
            document.getElementById('model-display').innerHTML = m === 'pro' ?
                `<i data-lucide="shield" class="w-3.5 h-3.5 text-red-400"></i> DX-1 PRO` :
                `<i data-lucide="cpu" class="w-3.5 h-3.5 text-blue-400"></i> DX-1`;
            lucide.createIcons();
        }

        function setMode(m) {
            currentMode = m;
            const modes = {
                fast: { i: 'zap', c: 'text-yellow-400', l: 'FAST' },
                deepthink: { i: 'brain', c: 'text-purple-400', l: 'DEEPTHINK' },
                canvas: { i: 'layout', c: 'text-emerald-400', l: 'CANVAS' }
            };
            const mode = modes[m];
            document.getElementById('mode-display').innerHTML = `<i data-lucide="${mode.i}" class="w-3.5 h-3.5 ${mode.c}"></i> ${mode.l}`;
            lucide.createIcons();
        }

        function scrollToBottom() {
            container.scrollTop = container.scrollHeight;
        }

        async function handleSend() {
            const val = input.value.trim();
            if(!val) return;

            document.getElementById('hero').style.display = 'none';
            container.style.display = 'block';
            input.value = '';

            wrapper.insertAdjacentHTML('beforeend', `<div class="user-bubble">${val}</div>`);

            const aiId = 'ai-' + Date.now();
            const isPro = currentModel === 'pro';

            let loaderHtml = `<div class="thinking-std animate-pulse">Processing Fast Request...</div>`;
            if (currentMode === 'deepthink' || isPro) {
                loaderHtml = `<div class="flex flex-col gap-2"><span class="text-[9px] text-red-500 font-bold uppercase tracking-widest">Deep Synapse Analysis</span><div class="thinking-pro"><div class="pro-bar"></div></div></div>`;
            }

            wrapper.insertAdjacentHTML('beforeend', `
            <div class="ai-bubble">
                <div class="ai-avatar ${isPro ? 'pro' : 'std'}"><i data-lucide="${isPro ? 'shield' : 'cpu'}" class="w-5 h-5 ${isPro ? 'text-red-400' : 'text-blue-400'}"></i></div>
                <div id="${aiId}" class="flex-1 text-sm leading-relaxed pt-2 markdown-content">${loaderHtml}</div>
            </div>`);

            lucide.createIcons();
            scrollToBottom();

            const aiDiv = document.getElementById(aiId);
            let fullText = "";

            try {
                const res = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: val, model: currentModel, mode: currentMode })
                });

                const reader = res.body.getReader();
                const decoder = new TextDecoder();
                aiDiv.innerHTML = "";

                while (true) {
                    const { value, done } = await reader.read();
                    if (done) break;
                    fullText += decoder.decode(value);
                    aiDiv.innerHTML = marked.parse(fullText);
                    scrollToBottom();
                }

                if(currentMode === 'canvas') {
                    const codeMatch = fullText.match(/```html\s?([\s\S]*?)```/) || fullText.match(/<html[\s\S]*?<\/html>/i);
                    if(codeMatch) {
                        const code = codeMatch[1] || codeMatch[0];
                        document.getElementById('preview-frame').srcdoc = code;
                        preview.classList.add('active');
                    }
                }
                hljs.highlightAll();
            } catch (e) {
                aiDiv.innerHTML = "<span class='text-red-500'>Neural link severed. Check console for details.</span>";
                console.error(e);
            }
        }

        function closePreview() { preview.classList.remove('active'); }

        input.addEventListener('keydown', e => {
            if (e.key === 'Enter') handleSend();
        });

        // Background Particles
        const cvs = document.getElementById('neural-canvas');
        const ctx = cvs.getContext('2d');
        let pts = [];
        function res() { cvs.width = window.innerWidth; cvs.height = window.innerHeight; }
        window.onresize = res; res();
        for(let i=0; i<45; i++) pts.push({x:Math.random()*cvs.width, y:Math.random()*cvs.height, vx:Math.random()-0.5, vy:Math.random()-0.5});
        function anim() {
            ctx.clearRect(0,0,cvs.width,cvs.height);
            pts.forEach(p => {
                p.x+=p.vx; p.y+=p.vy;
                if(p.x<0||p.x>cvs.width) p.vx*=-1; if(p.y<0||p.y>cvs.height) p.vy*=-1;
                ctx.fillStyle = "rgba(62,139,255,0.15)";
                ctx.beginPath(); ctx.arc(p.x,p.y,1.5,0,Math.PI*2); ctx.fill();
            });
            requestAnimationFrame(anim);
        }
        anim();
    </script>
</body>
</html>
