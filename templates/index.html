<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>DBNN DX-1 | DBNN </title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

    <style>
        :root {
            --brand-primary: #6366f1;
            --bg-deep: #020205;
            --glass-bg: rgba(10, 10, 15, 0.85);
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-deep);
            color: #e2e8f0;
            margin: 0;
            height: 100dvh;
            display: flex;
            overflow: hidden;
            -webkit-tap-highlight-color: transparent;
        }

        #main-layout { display: flex; width: 100%; height: 100%; position: relative; z-index: 10; }
        #chat-section { flex: 1; display: flex; flex-direction: column; position: relative; width: 100%; }

        #preview-section {
            background: #000; border-left: 1px solid rgba(255,255,255,0.1);
            transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
            overflow: hidden; display: flex; flex-direction: column;
            position: absolute; right: 0; top: 0; height: 100%; z-index: 50;
            width: 0; opacity: 0; pointer-events: none;
        }

        @media (min-width: 768px) {
            #preview-section { position: relative; }
            #preview-section.active { width: 50%; opacity: 1; pointer-events: auto; }
        }

        @media (max-width: 767px) {
            #preview-section.active { width: 100%; opacity: 1; pointer-events: auto; }
        }

        #preview-frame { width: 100%; height: 100%; border: none; background: #020205; }

        .chat-container {
            flex-grow: 1; overflow-y: auto; padding: 20px 16px 160px 16px;
            scroll-behavior: smooth; display: flex; flex-direction: column;
        }

        .chat-wrapper { width: 100%; max-width: 850px; margin: 0 auto; display: flex; flex-direction: column; }

        .chat-bubble { margin-bottom: 24px; opacity: 0; animation: fade-in 0.4s forwards; }
        @keyframes fade-in { to { opacity: 1; } }

        .chat-bubble-user {
            background: rgba(99, 102, 241, 0.15);
            color: #e2e8f0;
            padding: 12px 20px;
            border-radius: 20px 20px 4px 20px;
            width: fit-content;
            align-self: flex-end;
            font-weight: 500;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            border: 1px solid rgba(99, 102, 241, 0.3);
            backdrop-filter: blur(10px);
            max-width: 85%;
        }

        .chat-bubble-ai { color: #e2e8f0; display: flex; gap: 16px; align-self: flex-start; width: 100%; }

        .ai-avatar {
            width: 32px; height: 32px; border-radius: 8px;
            background: linear-gradient(135deg, #6366f1, #a855f7);
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 0 15px rgba(99, 102, 241, 0.4); flex-shrink: 0;
        }

        .ai-content { flex-grow: 1; font-size: 15px; line-height: 1.7; overflow-x: hidden; }

        .ai-content ul { list-style-type: disc; margin-left: 1.5rem; margin-bottom: 1rem; }
        .ai-content ol { list-style-type: decimal; margin-left: 1.5rem; margin-bottom: 1rem; }
        .ai-content li { margin-bottom: 0.5rem; display: list-item; }
        .ai-content strong { color: #818cf8; font-weight: 600; }
        .ai-content p { margin-bottom: 1rem; }
        .ai-content pre { overflow-x: auto; max-width: 100%; border-radius: 8px; margin: 12px 0; }

        .suggestions-grid {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 12px; margin-top: 24px; width: 100%;
        }
        .suggestion-chip {
            background: rgba(255, 255, 255, 0.02);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 18px; padding: 14px; font-size: 13px;
            color: #94a3b8; cursor: pointer; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex; flex-direction: column; gap: 10px;
        }
        .suggestion-chip:hover {
            background: rgba(99, 102, 241, 0.1);
            border-color: rgba(99, 102, 241, 0.5);
            color: white; transform: translateY(-3px) scale(1.02);
            box-shadow: 0 10px 20px -10px rgba(99, 102, 241, 0.3);
        }

        #mode-popup {
            position: absolute; bottom: 100px; left: 50%; transform: translateX(-50%) translateY(10px);
            background: var(--glass-bg); backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border); border-radius: 20px;
            padding: 8px; width: 220px; display: none; flex-direction: column; gap: 4px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.6); z-index: 100;
        }
        #mode-popup.active { display: flex; animation: popup-in 0.2s ease-out; transform: translateX(-50%) translateY(0); }

        .mode-option {
            display: flex; align-items: center; gap: 12px; padding: 10px 14px;
            border-radius: 12px; cursor: pointer; transition: 0.2s; font-size: 13px; font-weight: 500;
        }
        .mode-option:hover { background: rgba(255,255,255,0.08); }
        .mode-option.active { background: #6366f1; color: white; }

        .input-island-container {
            position: absolute; bottom: 0; left: 0; width: 100%;
            display: flex; justify-content: center; padding: 0 16px 20px 16px; z-index: 50;
            background: linear-gradient(to top, var(--bg-deep) 30%, transparent);
            padding-bottom: max(20px, env(safe-area-inset-bottom));
        }

        .input-island {
            width: 100%; max-width: 800px;
            background: var(--glass-bg); backdrop-filter: blur(32px); -webkit-backdrop-filter: blur(32px);
            border: 1px solid var(--glass-border);
            border-radius: 24px; padding: 10px 16px;
            display: flex; align-items: flex-end; gap: 10px;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.9);
        }

        #message-input {
            background: transparent; border: none; color: white;
            padding: 10px 4px; font-size: 16px; flex-grow: 1;
            resize: none; max-height: 150px; outline: none; font-family: 'Inter', sans-serif;
            line-height: 1.5;
        }

        #send-btn {
            width: 40px; height: 40px; border-radius: 12px;
            background: rgba(255, 255, 255, 0.1); color: #fff;
            display: flex; align-items: center; justify-content: center;
            margin-bottom: 2px; cursor: pointer; transition: all 0.2s; flex-shrink: 0;
            border: 1px solid transparent;
        }
        #send-btn:hover { background: rgba(255, 255, 255, 0.2); }
        #send-btn.is-active { background: #ef4444; color: white; border-color: #ef4444; }

        #neural-canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }

        .thinking-pulse { display: flex; align-items: center; gap: 10px; font-family: 'Space Grotesk', monospace; font-size: 12px; color: #818cf8; letter-spacing: 2px; animation: pulse-text 1.5s infinite; }
        @keyframes pulse-text { 0%, 100% { opacity: 0.5; } 50% { opacity: 1; } }
    </style>
</head>
<body>

    <canvas id="neural-canvas"></canvas>

    <div id="main-layout">
        <section id="chat-section">
            <div id="chat-container" class="chat-container">
                <div class="chat-wrapper" id="chat-wrapper">
                    <div class="chat-bubble chat-bubble-ai">
                        <div class="ai-avatar"><i data-lucide="zap" class="w-4 h-4 text-white"></i></div>
                        <div class="ai-content">
                            <p class="text-xl font-bold tracking-tight mb-1 bg-clip-text text-transparent bg-gradient-to-r from-indigo-400 to-purple-400">DBNN DX-1</p>
                            <p class="text-xs text-indigo-400/80 font-medium block uppercase tracking-widest mb-6">Neural OS Interface | Kerala, India</p>

                            <div class="suggestions-grid" id="start-suggestions">
                                <!-- Updated passing the target mode string as second argument -->
                                <div class="suggestion-chip" onclick="quickSend('Tell me a story', 'deep-research')">
                                    <i data-lucide="book-open" class="w-5 h-5 text-indigo-400"></i>
                                    <span class="font-medium text-white">Tell me a story</span>
                                    <span class="text-[10px] opacity-50">Creative writing & narrative</span>
                                </div>
                                <div class="suggestion-chip" onclick="quickSend('Make me a game', 'canvas')">
                                    <i data-lucide="gamepad-2" class="w-5 h-5 text-pink-400"></i>
                                    <span class="font-medium text-white">Make me a game</span>
                                    <span class="text-[10px] opacity-50">Logic & interactive code</span>
                                </div>
                                <div class="suggestion-chip" onclick="quickSend('Make me a PPT about AI', 'study')">
                                    <i data-lucide="presentation" class="w-5 h-5 text-orange-400"></i>
                                    <span class="font-medium text-white">Make PPT about AI</span>
                                    <span class="text-[10px] opacity-50">Knowledge & structure</span>
                                </div>
                                <div class="suggestion-chip" onclick="quickSend('Make text animation with code', 'study')">
                                    <i data-lucide="clapperboard" class="w-5 h-5 text-green-400"></i>
                                    <span class="font-medium text-white">Text animation</span>
                                    <span class="text-[10px] opacity-50">Frontend FX & CSS</span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div id="mode-popup">
                <div class="mode-option active" onclick="setMode('fast', 'zap')">
                    <i data-lucide="zap" class="w-4 h-4"></i> Fast Mode
                </div>
                <div class="mode-option" onclick="setMode('deep-research', 'brain-circuit')">
                    <i data-lucide="brain-circuit" class="w-4 h-4"></i> Deep Research
                </div>
                <div class="mode-option" onclick="setMode('canvas', 'code')">
                    <i data-lucide="code" class="w-4 h-4"></i> Canvas Code
                </div>
                <div class="mode-option" onclick="setMode('study', 'graduation-cap')">
                    <i data-lucide="graduation-cap" class="w-4 h-4"></i> Study Mode
                </div>
            </div>

            <div class="input-island-container">
                <form id="chat-form" class="input-island">
                    <div id="mode-trigger" onclick="toggleModePopup()">
                        <i id="active-mode-icon" data-lucide="zap" class="w-5 h-5 text-indigo-400"></i>
                    </div>
                    <textarea id="message-input" placeholder="Ask DBNN anything..." rows="1" enterkeyhint="send"></textarea>
                    <button type="submit" id="send-btn">
                        <i id="send-icon" data-lucide="arrow-up" class="w-5 h-5"></i>
                    </button>
                </form>
            </div>
        </section>

        <section id="preview-section">
            <div class="h-12 bg-[#0a0a0c] flex items-center justify-between px-5 border-b border-white/10 shrink-0">
                <div class="flex items-center gap-2">
                    <div class="w-2 h-2 rounded-full bg-green-500 animate-pulse"></div>
                    <span class="text-[10px] font-bold tracking-[0.2em] text-gray-400">LIVE DX-SYSTEM PREVIEW</span>
                </div>
                <button type="button" onclick="closePreview()" class="text-gray-500 hover:text-white transition p-2"><i data-lucide="x" class="w-5 h-5"></i></button>
            </div>
            <iframe id="preview-frame"></iframe>
        </section>
    </div>

    <script>
        lucide.createIcons();
        let currentMode = 'fast';
        let isProcessing = false;
        let abortController = null;
        let chatHistory = [];

        const chatContainer = document.getElementById('chat-container');
        const chatWrapper = document.getElementById('chat-wrapper');
        const previewSection = document.getElementById('preview-section');
        const previewFrame = document.getElementById('preview-frame');
        const sendBtn = document.getElementById('send-btn');
        const modePopup = document.getElementById('mode-popup');
        const messageInput = document.getElementById('message-input');

        // Mapping for modes to their respective icons
        const modeIcons = {
            'fast': 'zap',
            'deep-research': 'brain-circuit',
            'canvas': 'code',
            'study': 'graduation-cap'
        };

        function toggleModePopup() { modePopup.classList.toggle('active'); }

        function setMode(mode, iconName) {
            currentMode = mode;
            const iconEl = document.getElementById('active-mode-icon');
            iconEl.setAttribute('data-lucide', iconName);
            lucide.createIcons({nodes: [iconEl]});
            document.querySelectorAll('.mode-option').forEach(opt => {
                opt.classList.remove('active');
                if(opt.textContent.toLowerCase().includes(mode.replace('-', ' '))) opt.classList.add('active');
            });
            modePopup.classList.remove('active');
            if(mode !== 'canvas' && mode !== 'study') closePreview();
        }

        function closePreview() { previewSection.classList.remove('active'); }
        function openPreview(html) {
            previewSection.classList.add('active');
            const doc = previewFrame.contentWindow.document;
            doc.open(); doc.write(html); doc.close();
        }

        // Updated quickSend to automatically set the mode before submitting
        function quickSend(text, targetMode = null) {
            if (targetMode && modeIcons[targetMode]) {
                setMode(targetMode, modeIcons[targetMode]);
            }
            messageInput.value = text;
            document.getElementById('chat-form').dispatchEvent(new Event('submit'));
        }

        async function smartType(container, text) {
            const sections = text.split(/(```[\s\S]*?```)/g);
            for (let chunk of sections) {
                if (!chunk || !isProcessing) continue;
                if (chunk.startsWith('```')) {
                    const codeBox = document.createElement('div');
                    codeBox.innerHTML = marked.parse(chunk);
                    container.appendChild(codeBox);
                    codeBox.querySelectorAll('pre code').forEach(hljs.highlightElement);
                } else {
                    const textSpan = document.createElement('div');
                    container.appendChild(textSpan);
                    let i = 0;
                    let currentText = "";
                    const batchSize = 5;
                    while (i < chunk.length && isProcessing) {
                        currentText += chunk.slice(i, i + batchSize);
                        textSpan.innerHTML = marked.parse(currentText);
                        i += batchSize;
                        chatContainer.scrollTop = chatContainer.scrollHeight;
                        await new Promise(r => setTimeout(r, 1));
                    }
                    textSpan.innerHTML = marked.parse(chunk);
                }
            }
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        const canvas = document.getElementById('neural-canvas');
        const ctx = canvas.getContext('2d');
        let mouse = { x: null, y: null, radius: 180 };

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.onresize = resize;
        window.onmousemove = e => { mouse.x = e.clientX; mouse.y = e.clientY; };
        window.onmouseleave = () => { mouse.x = null; mouse.y = null; };
        resize();

        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.vX = (Math.random() - 0.5) * 0.5;
                this.vY = (Math.random() - 0.5) * 0.5;
                this.baseSize = Math.random() * 1.5 + 0.5;
                this.size = this.baseSize;
                this.hues = [230, 190, 270, 320];
                this.hue = this.hues[Math.floor(Math.random() * this.hues.length)];
            }
            update() {
                this.x += this.vX; this.y += this.vY;
                if(this.x < 0 || this.x > canvas.width) this.vX *= -1;
                if(this.y < 0 || this.y > canvas.height) this.vY *= -1;

                if(mouse.x != null) {
                    let dx = mouse.x - this.x;
                    let dy = mouse.y - this.y;
                    let dist = Math.sqrt(dx*dx + dy*dy);
                    if(dist < mouse.radius) {
                        const force = (mouse.radius - dist) / mouse.radius;
                        this.x -= dx * force * 0.03;
                        this.y -= dy * force * 0.03;
                        this.size = this.baseSize * (1 + force * 2);
                    } else {
                        this.size = this.baseSize;
                    }
                }
            }
            draw() {
                ctx.beginPath();
                ctx.fillStyle = `hsla(${this.hue}, 80%, 70%, 0.6)`;
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
                if (this.size > 2) {
                    ctx.shadowBlur = 10;
                    ctx.shadowColor = `hsla(${this.hue}, 80%, 70%, 0.6)`;
                } else {
                    ctx.shadowBlur = 0;
                }
            }
        }

        const particleCount = window.innerWidth < 768 ? 40 : 100;
        const particles = Array.from({length: particleCount}, () => new Particle());

        function animate(time) {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            for(let i=0; i<particles.length; i++) {
                particles[i].update();
                particles[i].draw();

                for(let j=i+1; j<particles.length; j++) {
                    let dx = particles[i].x - particles[j].x;
                    let dy = particles[i].y - particles[j].y;
                    let dist = Math.sqrt(dx*dx + dy*dy);

                    if(dist < 150) {
                        ctx.beginPath();
                        const grad = ctx.createLinearGradient(particles[i].x, particles[i].y, particles[j].x, particles[j].y);
                        grad.addColorStop(0, `hsla(${particles[i].hue}, 70%, 60%, ${0.2 * (1 - dist/150)})`);
                        grad.addColorStop(1, `hsla(${particles[j].hue}, 70%, 60%, ${0.2 * (1 - dist/150)})`);

                        ctx.strokeStyle = grad;
                        ctx.lineWidth = 0.8 * (1 - dist/150);
                        ctx.moveTo(particles[i].x, particles[i].y);
                        ctx.lineTo(particles[j].x, particles[j].y);
                        ctx.stroke();

                        if (Math.sin(time / 500 + i) > 0.98) {
                            ctx.beginPath();
                            ctx.fillStyle = `hsla(${particles[i].hue}, 80%, 70%, 0.8)`;
                            const pulsePos = (Math.sin(time / 200) + 1) / 2;
                            const px = particles[i].x + (particles[j].x - particles[i].x) * pulsePos;
                            const py = particles[i].y + (particles[j].y - particles[i].y) * pulsePos;
                            ctx.arc(px, py, 1.5, 0, Math.PI * 2);
                            ctx.fill();
                        }
                    }
                }
            }
            requestAnimationFrame(animate);
        }
        animate(0);

        function updateButtonUI(loading) {
            isProcessing = loading;
            if (loading) {
                sendBtn.classList.add('is-active');
                sendBtn.innerHTML = '<i data-lucide="square" class="w-5 h-5 fill-current"></i>';
            } else {
                sendBtn.classList.remove('is-active');
                sendBtn.innerHTML = '<i data-lucide="arrow-up" class="w-5 h-5"></i>';
            }
            lucide.createIcons({nodes: [sendBtn]});
        }

        document.getElementById('chat-form').onsubmit = async (e) => {
            e.preventDefault();
            if (isProcessing) {
                if (abortController) abortController.abort();
                isProcessing = false;
                updateButtonUI(false);
                return;
            }

            const val = messageInput.value.trim();
            if(!val) return;

            const suggestions = document.getElementById('start-suggestions');
            if(suggestions) suggestions.style.display = 'none';

            updateButtonUI(true);
            abortController = new AbortController();

            const uDiv = document.createElement('div');
            uDiv.className = 'chat-bubble chat-bubble-user';
            uDiv.innerText = val;
            chatWrapper.appendChild(uDiv);

            messageInput.value = ''; messageInput.style.height = 'auto';

            const aiDiv = document.createElement('div');
            aiDiv.className = 'chat-bubble chat-bubble-ai';
            aiDiv.innerHTML = `<div class="ai-avatar"><i data-lucide="cpu" class="w-4 h-4 text-white"></i></div>
                <div class="ai-content"><div class="thinking-pulse">ANALYZING...</div></div>`;
            chatWrapper.appendChild(aiDiv);
            lucide.createIcons({nodes:[aiDiv]});
            chatContainer.scrollTop = chatContainer.scrollHeight;

            try {
                const res = await fetch('/api/chat', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ message: val, mode: currentMode, history: chatHistory }),
                    signal: abortController.signal
                });

                const data = await res.json();
                const contentArea = aiDiv.querySelector('.ai-content');
                contentArea.innerHTML = '';

                if (data.error) {
                    contentArea.innerHTML = `<p class="text-red-400">${data.error}</p>`;
                } else {
                    let responseText = data.response;
                    const htmlMatch = responseText.match(/```html([\s\S]*?)```/);
                    if (htmlMatch && (currentMode === 'canvas' || currentMode === 'study')) openPreview(htmlMatch[1]);

                    await smartType(contentArea, responseText);
                    chatHistory.push({role: "user", content: val}, {role: "assistant", content: responseText});
                }
            } catch (err) {
                if (err.name !== 'AbortError') {
                    aiDiv.querySelector('.ai-content').innerHTML = "System Error.";
                } else {
                    aiDiv.querySelector('.ai-content').innerHTML = '<p class="text-gray-500 italic text-xs">Stopped.</p>';
                }
            } finally {
                updateButtonUI(false);
            }
        };

        messageInput.oninput = function() { this.style.height = 'auto'; this.style.height = Math.min(this.scrollHeight, 150) + 'px'; };
        messageInput.onkeydown = function(e) { if(e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); document.getElementById('chat-form').dispatchEvent(new Event('submit')); } };
    </script>
</body>
</html>
